name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - name: Build GitPublish.app + .dmg
        run: bash packaging/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GitPublish-macos
          path: dist/*.dmg

  others:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: GitPublish-linux
          - os: windows-latest
            out: GitPublish-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (opens the dashboard in the default browser)
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --name GitPublish --add-data "templates:templates" \
            --hidden-import app --hidden-import ghcore desktop.py
          if [ "${{ runner.os }}" = "Windows" ]; then mv dist/GitPublish.exe "dist/${{ matrix.out }}"
          else mv dist/GitPublish "dist/${{ matrix.out }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  release:
    needs: [macos, others]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
